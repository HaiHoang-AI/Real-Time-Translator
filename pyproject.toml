[project]
name = "rtt"
version = "0.1.0"
description = "Real-Time Translate — local subtitle overlay + cabin-style dubbing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "comtypes>=1.4.16",
    "faster-whisper>=1.2.1",
    "moonshine-voice>=0.1.3",
    "numpy>=1.26,<3",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.24.0.43",
    "piper-tts>=1.6.0",
    "pyaudiowpatch>=0.2.12.8",
    "pycaw>=20251023",
    "pyside6>=6.11.1",
    "sentencepiece>=0.2.2",
    "transformers>=5.14.1",
]
